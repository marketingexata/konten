<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EXATA Konten All Tim</title>
    <style>
      .ic {
        width: 1.15em;
        height: 1.15em;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -0.2em;
      }
      .logo {
        display: block;
        width: 210px;
        max-width: 70%;
        height: auto;
        margin: 0 auto 14px;
      }
      /* ========== 1. VARIABEL & DASAR ========== */

      :root {
        --n: #0b1a4a;
        --m: #d6157f;
        --o: #ff8a1f;
        --bg: #f2f4fb;
        --g: linear-gradient(90deg, #d6157f, #ff8a1f);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        background: var(--bg);
        color: #1b2240;
        min-height: 100vh;
      }
      [hidden] {
        display: none !important;
      }
      .wrap {
        max-width: 520px;
        margin: auto;
        padding: 16px 20px 100px;
      }
      @media (min-width: 900px) {
        .wrap {
          max-width: 880px;
        }
        .grid {
          grid-template-columns: repeat(4, 1fr) !important;
        }
        .gens {
          grid-template-columns: repeat(3, 1fr) !important;
        }
      }
      h2 {
        font-size: 20px;
        margin: 14px 0 10px;
      }
      h3 {
        margin-bottom: 12px;
      }
      /* ========== 2. HEADER & STATISTIK ========== */

      .hero {
        background: linear-gradient(135deg, #0b1a4a, #1d2f7a);
        color: #fff;
        border-radius: 22px;
        padding: 18px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .av {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--g);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        overflow: hidden;
        flex: none;
      }
      .av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero small {
        opacity: 0.75;
      }
      .stat {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .stat div {
        flex: 1;
        background: #fff;
        border-radius: 14px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: #555;
      }
      .stat b {
        display: block;
        font-size: 20px;
        color: var(--m);
      }
      /* ========== 3. MENU BUAT KONTEN ========== */

      .gens {
        display: grid;
        gap: 12px;
        margin-top: 6px;
      }
      .gc {
        background: #fff;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        gap: 14px;
        align-items: center;
        box-shadow: 0 4px 14px #0b1a4a14;
        cursor: pointer;
        border: 0;
        text-align: left;
        width: 100%;
        transition: 0.2s;
      }
      .gc:hover {
        transform: translateY(-3px);
      }
      .gc i {
        font-style: normal;
        font-size: 28px;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #fde8f3;
        display: grid;
        place-items: center;
      }
      .gc b {
        display: block;
      }
      .gc small {
        color: #667;
      }
      /* ========== 4. FORM & TOMBOL ========== */

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #dde1f0;
        border-radius: 12px;
        font-size: 15px;
        background: #fff;
        margin-bottom: 10px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        outline: 0;
        border-color: var(--m);
      }
      button {
        cursor: pointer;
        font-size: 15px;
      }
      .pri {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 14px;
        background: var(--g);
        color: #fff;
        font-weight: 700;
      }
      .sec {
        padding: 10px 14px;
        border: 1.5px solid #dde1f0;
        border-radius: 12px;
        background: #fff;
      }
      .dng {
        color: #d33;
        border-color: #f3c3c3;
      }
      .bar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .bar input,
      .bar select {
        margin: 0;
      }
      .bar .q {
        grid-column: 1/3;
      }
      /* ========== 5. KONTENKU: GRID & KARTU ========== */

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 12px;
      }
      .cd {
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 3px 12px #0b1a4a12;
        cursor: pointer;
      }
      .th {
        aspect-ratio: 4/3;
        background: #e6e9f5;
        position: relative;
        display: grid;
        place-items: center;
        font-size: 30px;
      }
      .th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }
      .th.lnk {
        background: linear-gradient(135deg, #d6157f, #ff8a1f);
        color: #fff;
      }
      .th small {
        font-size: 11px;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tg {
        position: absolute;
        left: 8px;
        top: 8px;
        background: #0b1a4acc;
        color: #fff;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 20px;
      }
      .sc {
        position: absolute;
        right: 8px;
        top: 8px;
        background: #fff;
        color: var(--m);
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
      }
      .cd p {
        padding: 8px 10px 2px;
        font-weight: 600;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cd small {
        padding: 0 10px 10px;
        display: block;
        color: #889;
        font-size: 12px;
      }
      .fab {
        position: fixed;
        right: max(20px, calc(50% - 440px));
        bottom: 90px;
        border: 0;
        background: var(--g);
        color: #fff;
        padding: 14px 20px;
        border-radius: 30px;
        font-weight: 700;
        box-shadow: 0 8px 20px #d6157f55;
        z-index: 5;
      }
      /* ========== 6. NAVIGASI BAWAH ========== */

      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -4px 18px #0b1a4a14;
        z-index: 6;
      }
      nav button {
        flex: 1;
        max-width: 200px;
        border: 0;
        background: 0;
        padding: 6px;
        color: #889;
        font-size: 12px;
      }
      nav button span {
        display: block;
        font-size: 22px;
      }
      nav button.on {
        color: var(--m);
        font-weight: 700;
      }
      /* ========== 7. POPUP ========== */

      .ov {
        position: fixed;
        inset: 0;
        background: #0b1a4acc;
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 20;
      }
      .ov.on {
        display: flex;
      }
      .md {
        background: #fff;
        width: 100%;
        max-width: 560px;
        max-height: 92vh;
        overflow: auto;
        border-radius: 24px 24px 0 0;
        padding: 20px;
        position: relative;
        animation: up 0.25s;
      }
      .md.full {
        height: 92vh;
        padding: 56px 0 0;
      }
      .md.full iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      @media (min-width: 700px) {
        .ov {
          align-items: center;
        }
        .md {
          border-radius: 24px;
        }
      }
      @keyframes up {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
      }
      .x {
        position: absolute;
        right: 12px;
        top: 12px;
        border: 0;
        background: #eef0f8;
        border-radius: 20px;
        padding: 7px 14px;
        font-weight: 600;
        z-index: 2;
      }
      /* ========== 8. FORM TAMBAH KONTEN ========== */

      .seg {
        display: flex;
        gap: 6px;
        margin: 6px 0 14px;
      }
      .seg button {
        flex: 1;
        padding: 10px;
        border: 1.5px solid #dde1f0;
        border-radius: 12px;
        background: #fff;
      }
      .seg .on {
        background: var(--n);
        color: #fff;
        border-color: var(--n);
      }
      .drop {
        display: block;
        border: 2px dashed #c9cfe6;
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        margin-bottom: 10px;
        cursor: pointer;
        color: #667;
      }
      .fi {
        display: flex;
        justify-content: space-between;
        background: #f2f4fb;
        border-radius: 10px;
        padding: 8px 12px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .fi button {
        border: 0;
        background: 0;
        color: #d33;
      }
      .sv {
        font-size: 12px;
        color: #2a9d5b;
        margin-bottom: 10px;
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .chk input {
        width: auto;
        margin: 0;
      }
      /* ========== 9. VIEWER KONTEN & DRAF ========== */

      .vw img,
      .vw iframe {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 10px;
        border: 0;
      }
      .vw iframe {
        height: 260px;
      }
      .vw a {
        color: var(--m);
        word-break: break-all;
      }
      .nl {
        background: #fff4e6;
        border-radius: 12px;
        padding: 12px;
        margin: 10px 0;
      }
      .draft {
        background: #fff4e6;
        border-radius: 12px;
        padding: 10px 14px;
        margin-top: 12px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .draft button {
        border: 0;
        background: var(--m);
        color: #fff;
        border-radius: 10px;
        padding: 6px 12px;
      }
      /* ========== 10. LOADING, ANIMASI & NOTIFIKASI ========== */

      #busy {
        position: fixed;
        inset: 0;
        background: #0b1a4aee;
        display: none;
        place-items: center;
        z-index: 50;
        color: #fff;
        text-align: center;
      }
      #busy.on {
        display: grid;
      }
      #pcw > svg {
        width: 130px;
        height: 130px;
        transform: rotate(-90deg);
      }
      #pcw {
        position: relative;
        display: inline-block;
      }
      #pc {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
      }
      .dots span {
        display: inline-block;
        font-size: 26px;
        animation: bn 1s infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bn {
        50% {
          transform: translateY(-12px);
        }
      }
      #toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #0b1a4a;
        color: #fff;
        padding: 10px 18px;
        border-radius: 20px;
        z-index: 60;
        font-size: 14px;
        display: none;
        max-width: 90%;
      }
      /* ========== 11. HALAMAN LOGIN ========== */

      .lk {
        text-align: center;
        margin: 12px 0 0 !important;
        font-size: 14px;
      }
      .lk a {
        color: var(--m);
      }
      #login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0b1a4a, #1d2f7a 60%, #5a1a6b);
        padding: 24px;
      }
      .lc {
        background: #fff;
        border-radius: 24px;
        padding: 26px;
        width: 100%;
        max-width: 380px;
      }
      .lc h1 {
        font-size: 19px;
        margin-bottom: 4px;
        text-align: center;
      }
      .lc p {
        color: #667;
        margin-bottom: 16px;
        font-size: 14px;
        text-align: center;
      }
    
      /* ========== TOMBOL POPUP GENERATOR (perlebar & tab baru) ========== */
      .tb { position: absolute; left: 12px; top: 10px; display: flex; gap: 8px; z-index: 2; }
      .tb .sec { padding: 7px 12px; font-size: 14px; }
      .md.full { transition: max-width 0.25s; }
      @media (min-width: 700px) { .md.full { max-width: 780px; } .md.full.wide { max-width: min(1400px, 97vw); } }
      @media (max-width: 699px) { .tb [data-a="w"] { display: none; } }
      @media (min-width: 700px) { .md.full.wide { height: 95vh; } }
      /* ========== REMINDER MINGGUAN ========== */
      .rm { display: flex; gap: 10px; align-items: flex-start; background: #fff4e6; border: 1.5px solid #ffd9a8; border-radius: 14px; padding: 12px 14px; margin: 10px 0; font-size: 13px; color: #4a3b22; }
      .rm.ok { background: #e8f7ee; border-color: #b6e3c7; color: #1d4d33; }
      .rm.hot { background: #ffe9ee; border-color: #f6b8c6; color: #5b1f2e; }
      .rm > svg { flex: none; width: 22px; height: 22px; margin-top: 1px; }
      .rm b { display: block; font-size: 14px; margin-bottom: 2px; }
      .rm .ac { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .rm .ac button { border: 0; border-radius: 10px; padding: 6px 12px; background: var(--m); color: #fff; font-weight: 600; font-size: 13px; }
      .rm .ac .gh { background: #fff; color: #556; border: 1.5px solid #dde1f0; }
      .rm > div { flex: 1; min-width: 0; }
      .rm .pb { margin-top: 8px; }
      .rm .pl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
      .rm .pt { height: 10px; background: #00000014; border-radius: 10px; overflow: hidden; }
      .rm .pt i { display: block; height: 100%; border-radius: 10px; background: var(--g); transition: width 0.8s ease; }
      .rm.ok .pt i { background: #2a9d5b; }
      .rm .ac { margin-top: 10px; }
      .rm.debt { background: #f3e8ff; border-color: #d9bdf7; color: #3f1d63; }
      .rm.debt details { margin-top: 6px; }
      .rm.debt summary { cursor: pointer; font-weight: 600; font-size: 12px; }
      .rm.debt ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
</style>
  </head>
  <body>
    <!-- ========== SPRITE IKON ========== -->
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="i-add" viewBox="0 0 24 24">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
          <path d="M12 8v8M8 12h8" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />

        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /></symbol>
        <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2" />

          <path d="M3 17l5-5 4 4 3-3 6 6" />
        </symbol>
        <symbol id="i-video" viewBox="0 0 24 24">
          <rect x="3" y="6" width="13" height="12" rx="2" />
          <path d="M16 10l5-3v10l-5-3" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"
          />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16" /></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24">
          <path d="M4 8h3l2-3h6l2 3h3v11H4z" />
          <circle cx="12" cy="13" r="3.5" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4zM10 20h4"/></symbol><symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol><symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol></defs>
    </svg>

    <!-- ========== HALAMAN LOGIN ========== -->
    <div id="login" hidden>
      <div class="lc">

    <div id="busy">

          </svg>

          ><span

          ><span

    <!-- ========== SCRIPT ========== -->
    <script>
      // ========== 1. KONFIGURASI ==========

      const API = "https://script.google.com/macros/s/AKfycbw-Xc6av-tQE3agdtGOAeTC9PtUnvQkUh2bM-_qQElLhyi3cvaFPWHTsbTP6JuU3PrIXw/exec",
        CH = 3145728;
      const GEN = [
        ["text", "Script Generator", "Buat naskah & script konten", "scriptgenerator.html"],
        ["image", "Picture Generator", "Buat prompt gambar", "gambargenerator.html"],
        ["video", "Video Generator", "Buat prompt video 9 langkah", "videogenerator.html"],
      ];
      const I = (n) => `<svg class="ic"><use href="#i-${n}"/></svg>`;
      // ========== 2. HELPER & STATE ==========

      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      let U = JSON.parse(localStorage.sess || "null"),
        K = [],
        tab = "gen",
        F = { q: "", j: "", d: "" },
        bT,
        loaded = 0,
        bfRun = 0;
      // ========== 3. PENYIMPANAN DRAF (IndexedDB) ==========

      const idb = new Promise((r) => {
        const q = indexedDB.open("ex", 1);
        q.onupgradeneeded = () => q.result.createObjectStore("f");
        q.onsuccess = () => r(q.result);
      });
      const st = async (m, f) => {
        const d = await idb;
        return new Promise((r) => {
          const q = f(d.transaction("f", m).objectStore("f"));
          q.onsuccess = () => r(q.result);
        });
      };
      // ========== 4. KOMUNIKASI KE APPS SCRIPT ==========

      async function api(a, d = {}) {
        const r = await fetch(API, {
          method: "POST",
          body: JSON.stringify({ a, u: U && U.nama, p: U && U.p, ...d }),
        });
        const j = await r.json();
        if (j.err) throw new Error(j.err);
        return j;
      }
      const rt = async (f) => {
        for (let i = 0; ; i++)
          try {
            return await f();
          } catch (e) {
            if (i > 2) throw e;
            await new Promise((r) => setTimeout(r, 1500 * (i + 1)));
          }
      };
      // ========== 5. LOADING & NOTIFIKASI ==========

      function setP(p, t) {
        p = Math.round(p);
        $("#pc").textContent = p + "%";
        $("#ring").style.strokeDashoffset = 283 - 2.83 * p;
        if (t) $("#bt").textContent = t;
      }
      function busy(on, t, man) {
        clearInterval(bT);
        if (!on) {
          setP(100);
          setTimeout(() => $("#busy").classList.remove("on"), 350);
          return;
        }
        $("#busy").classList.add("on");
        setP(0, t || "Memproses…");
        if (!man) {
          let p = 0;
          bT = setInterval(() => {
            p += (92 - p) * 0.08;
            setP(p);
          }, 200);
        }
      }
      async function task(t, f) {
        busy(1, t);
        try {
          return await f();
        } catch (e) {
          toast(e.message);
        } finally {
          busy(0);
        }
      }
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.style.display = "block";
        setTimeout(() => (t.style.display = "none"), 3500);
      }
      // ========== 6. POPUP ==========

      function openGen(src) {
        const show = () => {
          const o = modal(`<iframe src="${src}" allow="clipboard-write; clipboard-read; fullscreen" allowfullscreen></iframe>`, 1),
            md = o.querySelector(".md"),
            tb = document.createElement("div");
          tb.className = "tb";
          tb.innerHTML = `<button class="sec" data-a="w">${I("expand")} Perlebar</button><button class="sec" data-a="n">${I("ext")} Tab baru</button>`;
          md.append(tb);
          if (localStorage.genw == "1" && matchMedia("(min-width:700px)").matches) {
            md.classList.add("wide");
            tb.querySelector('[data-a="w"]').innerHTML = I("expand") + " Normal";
          }
          tb.querySelector('[data-a="w"]').onclick = (e) => {
            const w = md.classList.toggle("wide");
            localStorage.genw = w ? "1" : "0";
            e.currentTarget.innerHTML = I("expand") + (w ? " Normal" : " Perlebar");
          };
          tb.querySelector('[data-a="n"]').onclick = () => window.open(src, "_blank");
        };
        fetch(src, { method: "HEAD" })
          .then((r) =>
            r.ok
              ? show()
              : toast("File " + src + " tidak ditemukan. Letakkan di folder yang sama dengan index.html"),
          )
          .catch(show);
      }
      function modal(h, full) {
        const o = document.createElement("div");
        o.className = "ov on";
        o.innerHTML = `<div class="md${full ? " full" : ""}"><button class="x">${I("x")} Tutup</button>${h}</div>`;
        o.querySelector(".x").onclick = () => o.remove();
        const onKey = (e) => {
          if (!o.isConnected) return document.removeEventListener("keydown", onKey);
          if (e.key == "Escape" && o == [...document.querySelectorAll(".ov")].pop()) o.remove();
        };
        document.addEventListener("keydown", onKey);
        document.body.append(o);
        return o;
      }
      // ========== 7. UTILITAS KONTEN ==========

      const thumbOf = (k) => {
        if (k.thumb && k.thumb !== "-") return k.thumb;
        const u = String(k.url || "");
        let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
        if (m) return "https://img.youtube.com/vi/" + m[1] + "/hqdefault.jpg";

                  b = await new Promise((r) => {
                    const x = new FileReader();
                    x.onload = () => r(x.result.split(",")[1]);
                    x.readAsDataURL(f.slice(off, e));
                  });
                const r = await rt(() => api("chunk", { url: s.url, b, s: off, t: f.size, m }));
                dn += e - off;
                off = e;
                setP((dn / tot) * 97, "Mengunggah " + f.name);
                if (r.done) {
                  out.push({ id: r.id, n: f.name, m });
                  break;
                }
              }
            }
            setP(98, "Menyimpan data…");
            await api("addUp", { t, files: JSON.stringify(out), folder: fol, cat });
            busy(0);
            await done();
            toast("Konten terupload");
          } catch (e) {
            busy(0);
            toast("Gagal: " + e.message + ". Draf kamu aman, coba lagi.");
          }
        };
      }
      if (U) load().catch(() => render());
      else render();
    </script>
  </body>
</html>
